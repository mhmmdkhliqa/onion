<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Menu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class=" bg-menu-yellow">
    <div class=" container py-4">
                <!--DRINKS-->

        <section class="mb-5">
            <h2 class="text-center fw-bold mb-4 judul-menu">DRINKS</h2>
            <div class="row g-4 justify-content-center">

                <!--COCA COLA-->
                <div class="col-12 col-md-4">
                    <div class="card card-menu shadow rounded-4 h-100 text-center p-3 position-relative">
                        <img src="COCA COLA.png" class=" mx-auto mb-4" alt="alt burger">
                        <div class="card-body d-flex flex-column justify-content-between p-0">
                            <div>
                                <h5 class="card-title fw-bold text-uppercase">Coca cola</h5>
                                <p class="card-text fs-5 text-muted">Minuman berkarbonasi dengan rasa cola</p>
                            </div>
                            <div class="mt-4">
                                <span class="badge-harga d-inline-block px-3 py-3 fs-6">Rp 7.000</span>
                            </div>
                        </div>
                    </div>
                </div>
                <!--Cholate milkshake-->
                
                <div class="col-12 col-md-4">
                    <div class="card card-menu shadow rounded-4 h-100 text-center p-3 position-relative">
                        <img src="cokelatmilkshake.png" class=" mx-auto mb-4" alt="alt burger">
                        <div class="card-body d-flex flex-column justify-content-between p-0">
                            <div>
                                <h5 class="card-title fw-bold text-uppercase">Cokelat Milkshake</h5>
                                <p class="card-text text-muted">Minuman dengan isian cokelat dan atasan cream</p>
                            </div>
                            <div class="mt-4">
                                <span class="badge-harga d-inline-block px-3 py-3 fs-6">Rp 8.000</span>
                            </div>
                        </div>
                    </div>
                </div>
                <!--Milo ice-->
                <div class="col-12 col-md-4">
                    <div class="card card-menu shadow rounded-4 h-100 text-center p-3 position-relative">
                        <img src="MiloIced.png" class="mx-auto mb-4" alt="alt burger">
                        <div class="card-body d-flex flex-column justify-content-between p-0">
                            <div>
                                <h5 class="card-title fw-bold text-uppercase">ICED MILO</h5>
                                <p class="card-text text-muted">Minuman milo es</p>
                            </div>
                            <div class="mt-4">
                                <span class="badge-harga d-inline-block px-3 py-3 fs-6">Rp 5.000</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
       
    </div>
     <div class="text-center mt-1 mb-3">
        <a href="index.html" class="btn btn-dark btn-lg fw-bold btn-lg fw-bold rounded-pill px-4 py-2 shadow-sm ">
            kembali ke beranda
        </a>
    </div>


</body>
</html>
