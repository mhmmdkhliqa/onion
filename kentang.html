<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snack</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(to bottom, #ffd32a, #ffc107);
        font-family: Arial, sans-serif;
      }

      .tombol-kembali {
        position: absolute;
        top: 20px;
        right: 25px;
        background-color: #b06500;
        border: none;
        color: white;
        padding: 8px 20px;
        border-radius: 8px;
        font-weight: bold;
        z-index: 10;
      }

      .tombol-kembali:hover {
        background-color: #000;
        color: white;
      }

      .snack-section {
        min-height: 94vh;
        position: relative;
        padding-top: 45px;
      }

      .judul {
        font-family: Georgia, serif;
        font-weight: bold;
        font-size: 25px;
      }

      .garis {
        width: 122px;
        height: 2px;
        background-color: #b76b00;
        position: relative;
      }

      .garis::after {
        content: "";
        position: absolute;
        width: 122px;
        height: 2px;
        background-color: #b76b00;
        top: 6px;
        left: 0;
      }

      .snack-card {
        width: 180px;
        min-height: 290px;
        background-color: #ffe8a3;
        border-radius: 8px;
        box-shadow: 8px 10px 10px rgba(0, 0, 0, 0.35);
        padding: 14px;
      }

      .snack-card img {
        width: 100%;
        height: 145px;
        object-fit: contain;
      }

      .snack-card h5 {
        font-size: 16px;
        font-weight: bold;
        margin-top: 5px;
      }

      .snack-card p {
        font-size: 9px;
        font-weight: bold;
        line-height: 1.4;
        margin-top: 15px;
      }

      .harga {
        display: inline-block;
        background-color: #e67e22;
        padding: 5px 8px;
        border-radius: 5px;
        font-size: 17px;
        font-weight: bold;
        margin-top: 5px;
      }

      footer {
        font-size: 10px;
        text-align: center;
        background-color: #b06500;
        color: white;
        font-weight: bold;
        padding: 15px;
        margin-top: auto;

        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>

  <body>
    <a href="index.html" class="btn tombol-kembali">
      ← Kembali ke Halaman Utama
    </a>
    <section class="snack-section">
      <!-- Judul -->
      <div class="container pt-3">
        <div class="row align-items-center justify-content-center">
          <div class="col-auto">
            <div class="garis"></div>
          </div>

          <div class="col-auto">
            <h1 class="judul mb-0">SNACK</h1>
          </div>

          <div class="col-auto">
            <div class="garis"></div>
          </div>
        </div>
      </div>

      <!-- Card Snack -->
      <div class="container d-flex justify-content-center mt-4">
        <div class="snack-card">
          <img src="kentang.jpg" alt="French Fries" />

          <h5>FRENCH FRIES</h5>
          <p>Kentang goreng gurih disajikan dengan saus spesial</p>

          <div class="harga">Rp 12.000</div>
        </div>
      </div>
    </section>

    <footer>© 2026 AmbaFood. All Rights Reserved.</footer>
  </body>
</html>
